# requirements.lock — üretim imajının Python paketleri, TAM sürümleriyle.
#
# NEDEN
#   pyproject.toml sürüm ARALIĞI verir. Kilit olmadan her imaj derlemesi aralıktaki
#   en yeni sürümü kurar ve upstream'e giden istek (HTTP yığını, TLS, gövdenin
#   üretilişi) kod değişmeden değişebilir. Operatör kararı (19 Kasım 2026):
#   paket sürümleri ve taban imaj sabitlenir. Ayrıntı: docs/LESSONS_2026_11_14.md §20.6.
#
# NE
#   `pip install ".[tokens,browser]"` kurulumunun Python 3.12 / linux x86_64 için
#   tam kapanışı. Sürümler, canlıdaki commit'in (03aca2c) yayına alındığı andaki
#   PyPI durumuna (17 Kasım 2026 07:55 UTC) göre çözülmüştür: o derlemenin kurmuş
#   olması gereken küme. Upstream'e gönderen yığın (httpx, httpcore, h2, hpack,
#   hyperframe, h11, certifi, anyio, idna) o günden bu yana hiç sürüm çıkarmadı.
#
# NASIL KULLANILIR
#   Dockerfile paketleri `pip install -c requirements.lock ...` ile kurar; ardından
#   scripts/verify_lock.py kurulu her paketi bu dosyayla karşılaştırır. Kilitte
#   olmayan ya da sürümü farklı tek bir paket derlemeyi BAŞARISIZ kılar: sessiz
#   değişiklik olmaz. CI aynı kurulumu Python 3.12'de yapıp bütün testleri koşar.
#
# NASIL GÜNCELLENİR — yalnız bilerek; güncelleme gönderme tarafını değiştirebilir
#   uv pip compile pyproject.toml --extra tokens --extra browser \
#       --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
#       --exclude-newer <ISO tarih> --no-header -o /tmp/yeni.txt
#   Bu başlığı koruyarak aşağıdaki listeyi değiştirin. Sonra
#   tests/test_requirements_lock.py ve tests/test_wire_contract.py geçmeli.
#   Canlıya alma bir restart'tır: taze cURL ile aynı anda yapılır.
#
# ELLE DÜZENLEMEYİN (sürüm satırları üretilmiştir).

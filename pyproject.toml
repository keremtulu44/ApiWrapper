[project]
name = "apiwrapper"
version = "1.0.0"
description = "OpenAI-compatible REST API wrapper for an upstream Web LLM service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Üst sınırlar bilinçlidir: sınırsız `>=` altında bir rebuild (Render'da
    # autoDeploy) majör sürüm atlayabilir ve çalışan servis sessizce değişir.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx[http2]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<26.0",
    "pyyaml>=6.0,<7.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.42,<2.0"]
tokens = ["tiktoken>=0.6,<1.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "respx>=0.21,<1.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
    # mypy'nin `import yaml` için stub'ı; aksi halde CI'daki mypy adımı kırılır.
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Doküman tablosu: her satır `docs/ENV_FULL.md` içinde tek bir tablo hücresi.
# Metni 100 kolona sığdırmak için cümleleri bölmek açıklamayı okunamaz yapıyor.
"scripts/env_template.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Render Blueprint: tek instance Docker Web Service, Free plan.
# Gizli değerler depoya yazılmaz; Blueprint oluşturulurken Render sorar.
#
# PLAN (operatör kararı, 19 Kasım 2026): `free` — canlı servisin gerçek planı.
# Render'ın Free plan için belgeledikleri (https://render.com/docs/free) bu servisi
# doğrudan ilgilendirir, çünkü bu sürümde süreç yeniden başlarsa upstream oturumu
# ölür (çerez kavanozu bellektedir):
#   * 15 dakika istek almayan servis UYUR; uyanış yeni süreçtir. Servisi uyanık
#     tutan şey DIŞARIDAKİ zamanlayıcıdır (cron-job.org, düzenli `GET /`).
#   * "Render might restart a Free web service at any time."
#   * Çalışma alanı başına ayda 750 Free saat; biterse Free servisler ay sonuna
#     kadar askıya alınır (7/24 çalışan TEK servis en çok 744 saat kullanır).
# Ayrıntı: docs/RENDER.md (baştaki not), docs/ROLLBACK_2026_11_16.md §12.8.
services:
  - type: web
    name: apiwrapper
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeploy: true
    # Process ayakta olması ile dağıtım ayarlarının hazır olması ayrıdır.
    healthCheckPath: /readyz
    envVars:
      - key: API_KEYS
        sync: false
      # Network'teki tamamlanmış create-evaluation isteğini normal cURL olarak
      # yapıştırın. Domain, yol, mode, cookie/token ve tarayıcı header'ları
      # başlangıçta bundan çıkarılır; ham değer loglanmaz.
      - key: UPSTREAM_CURL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: AUTH_DISABLED
        value: "false"
      # KALICI değer `static`. Sunucudaki Chromium'un ürettiği token (`browser`)
      # hedefte `403 recaptcha validation failed` alıyor (14 Kasım 2026 ölçümü);
      # aynı çerez/gövde ile gerçek tarayıcıdan alınmış statik token çalışıyor ve
      # UPSTREAM_CURL'ün gövdesinden kendiliğinden okunuyor. Burada `browser`
      # yazılıysa cURL'deki token KULLANILMAZ (içe aktarım seçimi static'e çevirmez).
      # 16/17 Kasım geri dönüşü bu satırı `browser`a döndürmüştü; 19 Kasım'da düzeltildi.
      - key: RECAPTCHA_PROVIDER
        value: static
      # reCAPTCHA site key public'tir; cookie/token değildir.
      - key: RECAPTCHA_SITE_KEY
        value: 6LeTGMcsAAAAALuIlkVwIxaAuZA8VledA6d3Nnb0
      - key: RECAPTCHA_VERSION
        value: enterprise
      - key: RECAPTCHA_ACTION
        value: chat_submit
      - key: RECAPTCHA_BROWSER_TIMEOUT
        value: "45"

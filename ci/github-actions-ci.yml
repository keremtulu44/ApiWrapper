name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tokens]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

# NOT: Bu dosya, GitHub App'in `workflows` izni bulunmadığı için
# `.github/workflows/` altına push edilemedi. Etkinleştirmek için:
#   mkdir -p .github/workflows && git mv ci/github-actions-ci.yml .github/workflows/ci.yml
